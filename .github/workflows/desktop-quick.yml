name: Desktop quick check

# The full Check workflow runs on main and PRs; a feature branch pushed without a PR saw
# nothing at all, which is how a broken branch tip went unnoticed until it was opened
# locally. This is the cheap floor under every other push: one Linux job that compiles the
# desktop and runs its fast tests.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: desktop-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Desktop · compile + fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Compile
        run: ./gradlew :desktopApp:compileKotlin

      # The analyser pair needs the native analysis stack and is covered by the full check
      # on main; everything else here is pure JVM.
      - name: Fast tests
        run: >
          ./gradlew :desktopApp:test
          --tests 'com.music.bitchord.desktop.*'
          --tests '!com.music.bitchord.desktop.DesktopAnalysisTest'
          --tests '!com.music.bitchord.desktop.DesktopAutomixTest'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-quick-test-reports
          path: desktopApp/build/reports/tests/
