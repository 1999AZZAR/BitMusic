name: Release
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages (e.g. 1.2.0 or leave blank to use version.txt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Version and Tag
        id: ver
        run: |
          raw_version="${{ inputs.version }}"
          if [ -n "$raw_version" ]; then
            version="${raw_version#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -f "version.txt" ]; then
            version=$(tr -d '[:space:]' < version.txt)
          else
            version="1.2.0"
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "$version" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Target version: ${version}"
          echo "Target tag: ${tag}"

  linux:
    name: Linux · AppImage, deb, rpm
    needs: [prepare]
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pbitchord.version=${{ needs.prepare.outputs.version }} -Pbitchord.desktopOnly=true

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pbitchord.version=${{ needs.prepare.outputs.version }} -Pbitchord.desktopOnly=true

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitMusic/lib/app/desktopApp*.jar 2>/dev/null || ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          app_dir="desktopApp/build/compose/binaries/main/app/BitMusic"
          [ -d "$app_dir" ] || app_dir="desktopApp/build/compose/binaries/main/app/BitChord"
          desktopApp/packaging/appimage.sh \
            "$app_dir" \
            dist/BitMusic-${{ needs.prepare.outputs.version }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/BitMusic-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/BitMusic-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    needs: [prepare]
    runs-on: windows-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pbitchord.version=${{ needs.prepare.outputs.version }}" "-Pbitchord.desktopOnly=true"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=${{ needs.prepare.outputs.version }}" "-Pbitchord.desktopOnly=true"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitMusic/app/desktopApp*.jar 2>/dev/null || ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitMusic-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/BitMusic-$v-windows-x64-setup.exe"
          $appDir = if (Test-Path "desktopApp/build/compose/binaries/main/app/BitMusic") { "desktopApp/build/compose/binaries/main/app/BitMusic/*" } else { "desktopApp/build/compose/binaries/main/app/BitChord/*" }
          7z a -tzip -mx=5 "dist/BitMusic-$v-windows-x64-portable.zip" $appDir | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pbitchord.version=${{ needs.prepare.outputs.version }} -Pbitchord.desktopOnly=true

      - name: Build DMG, PKG and the app bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Pbitchord.version=${{ needs.prepare.outputs.version }} -Pbitchord.desktopOnly=true

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitMusic.app/Contents/app/desktopApp*.jar 2>/dev/null || ls desktopApp/build/compose/binaries/main/app/BitChord.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Collect
        run: |
          v="${{ needs.prepare.outputs.version }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/BitMusic-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/BitMusic-$v-macos-$arch.pkg"
          done
          appBundle="desktopApp/build/compose/binaries/main/app/BitMusic.app"
          [ -d "$appBundle" ] || appBundle="desktopApp/build/compose/binaries/main/app/BitChord.app"
          ditto -c -k --keepParent "$appBundle" "dist/BitMusic-$v-macos-$arch.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  android-tv:
    name: Android TV · APK
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Build Android TV Release APK
        run: ./gradlew :tv:assembleProdRelease -Pbitchord.version=${{ needs.prepare.outputs.version }}

      - name: Collect
        run: |
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          for f in tv/build/outputs/apk/prod/release/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "dist/BitMusic-$v-android-tv.apk"
            fi
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv-artifacts
          path: dist/*

  release:
    name: Publish Release
    needs: [prepare, linux, windows, macos, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: Inspect Distributables
        run: |
          echo "All release binaries successfully built:"
          ls -lh dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BitMusic ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
